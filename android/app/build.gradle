plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.tiktokclipper'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.tiktokclipper'
        minSdk 26          // Android 8.0
        targetSdk 34
        versionCode 3
        versionName '1.0.2'
        ndk {
            // телефоны: 64 и 32 бита ARM (распознавание речи Vosk — нативная библиотека)
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        // Постоянный ключ, чтобы обновления ставились поверх прежней версии. Сам ключ НЕ хранится в проекте:
        // GitHub Actions берёт его из секретов репозитория (NAREZKA_KEYSTORE_B64, NAREZKA_KEY_PASSWORD).
        narezka {
            def ks = System.getenv('NAREZKA_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('NAREZKA_KEY_PASSWORD')
                keyAlias 'narezka'
                keyPassword System.getenv('NAREZKA_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // без секретов (сборка у себя) — отладочный ключ
            signingConfig System.getenv('NAREZKA_KEYSTORE') ? signingConfigs.narezka : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding 'UTF-8'
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Офлайн-распознавание речи (Maven Central)
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
}

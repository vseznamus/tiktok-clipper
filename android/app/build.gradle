plugins {
    id 'com.android.application'
}

// Варианты вычислительного ядра ggml (MODULE-библиотеки) копируются сюда при сборке нативной части.
def ggmlModules = "${layout.buildDirectory.get().asFile}/ggml-modules"

android {
    namespace 'ru.tiktokclipper'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.tiktokclipper'
        minSdk 26          // Android 8.0
        targetSdk 34
        versionCode 6
        versionName '1.3.0'
        ndk {
            // телефоны: 64 и 32 бита ARM (Vosk — на обоих, Whisper — только на 64-битных)
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', "-DNAREZKA_MODULES_DIR=${ggmlModules}"
            }
        }
    }

    // Распознавание речи Whisper (whisper.cpp) — нативная часть, см. src/main/cpp/CMakeLists.txt
    ndkVersion '27.2.12479018'
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs += ggmlModules
        }
    }

    signingConfigs {
        // Постоянный ключ, чтобы обновления ставились поверх прежней версии. Сам ключ НЕ хранится в проекте:
        // GitHub Actions берёт его из секретов репозитория (NAREZKA_KEYSTORE_B64, NAREZKA_KEY_PASSWORD).
        narezka {
            def ks = System.getenv('NAREZKA_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('NAREZKA_KEY_PASSWORD')
                keyAlias 'narezka'
                keyPassword System.getenv('NAREZKA_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // без секретов (сборка у себя) — отладочный ключ
            signingConfig System.getenv('NAREZKA_KEYSTORE') ? signingConfigs.narezka : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding 'UTF-8'
    }

    packaging {
        jniLibs {
            // библиотеки распаковываются в папку приложения: ggml загружает оттуда вариант ядра под процессор
            useLegacyPackaging true
            pickFirsts += ['**/libggml-cpu-*.so']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Офлайн-распознавание речи (Maven Central)
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
}

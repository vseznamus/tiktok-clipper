# Сборка APK на серверах GitHub при каждой загрузке изменений (или вручную: Actions → «Сборка APK» → Run workflow).
# Готовый файл публикуется в разделе Releases: https://github.com/<владелец>/<репозиторий>/releases/latest
name: Сборка APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", "tclip/static/**", ".github/workflows/android-apk.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Интерфейс в assets
        run: bash android/tools/sync_web.sh
      - name: Сборка
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Переименование
        run: cp android/app/build/outputs/apk/release/app-release.apk Narezka.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tiktok-clipper-apk
          path: Narezka.apk
      - name: Публикация в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" Narezka.apk \
            --title "Нарезка — сборка ${{ github.run_number }}" \
            --notes "Скачайте Narezka.apk на телефон и установите. Инструкция: INSTRUCTION_APP.md"

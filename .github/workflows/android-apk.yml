# Сборка APK на серверах GitHub при каждой загрузке изменений (или вручную: Actions → «Сборка APK» → Run workflow).
# Готовый файл публикуется в разделе Releases: https://github.com/<владелец>/<репозиторий>/releases/latest
name: Сборка APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", "tclip/static/**", ".github/workflows/android-apk.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Интерфейс в assets
        run: bash android/tools/sync_web.sh
      - name: Ключ подписи из секретов
        env:
          KS_B64: ${{ secrets.NAREZKA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/narezka.keystore"
            echo "NAREZKA_KEYSTORE=$RUNNER_TEMP/narezka.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрет NAREZKA_KEYSTORE_B64 не задан — APK подписан временным ключом, поверх старой версии не встанет"
          fi
      - name: Сборка
        working-directory: android
        env:
          NAREZKA_KEY_PASSWORD: ${{ secrets.NAREZKA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Ошибки сборки (кратко)
        if: failure()
        run: |
          L="$RUNNER_TEMP/build.log"
          enc() { sed -e 's/%/%25/g' | awk '{printf "%s%%0A", substr($0,1,300)}'; }
          echo "::error title=what went wrong::$(grep -A25 'What went wrong' "$L" | head -60 | enc)"
          echo "::error title=compiler::$(grep -E 'error:|CMake Error|undefined (reference|symbol)|fatal error' "$L" | head -30 | enc)"
          echo "::error title=cmake::$(grep -B2 -A12 'CMake Error' "$L" | head -50 | enc)"
      - name: Переименование и проверка нативных библиотек
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Narezka.apk
          unzip -l Narezka.apk | grep '\.so$'
          for lib in arm64-v8a/libnarezka_whisper.so arm64-v8a/libwhisper.so arm64-v8a/libggml-base.so \
                     arm64-v8a/libggml-cpu-android_armv8.0_1.so arm64-v8a/libggml-cpu-android_armv8.2_1.so \
                     arm64-v8a/libc++_shared.so arm64-v8a/libvosk.so armeabi-v7a/libvosk.so; do
            unzip -l Narezka.apk | grep -q "lib/$lib" || { echo "::error::В APK нет lib/$lib"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tiktok-clipper-apk
          path: Narezka.apk
      - name: Публикация в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" Narezka.apk \
            --title "Нарезка — сборка ${{ github.run_number }}" \
            --notes "Скачайте Narezka.apk на телефон и установите. Инструкция: INSTRUCTION_APP.md"
